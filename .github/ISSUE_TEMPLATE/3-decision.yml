name: Decision
description: An open question that blocks or shapes work.
title: "[Decision] <question>"
labels: ["type:decision"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why it matters and which requirements depend on it.
  - type: textarea
    id: options
    attributes:
      label: Options
      description: One per line, with its consequence. Mark the recommended one.
  - type: textarea
    id: decision
    attributes:
      label: Decision
      description: Filled in when decided. Then update the spec and close this issue.
