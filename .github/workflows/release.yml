name: Docker image

on:
  # Called by release-please.yml on every push to main.
  workflow_call:
    inputs:
      version:
        description: Released version (such as 0.4.0), or empty for a preview build of main
        type: string
        default: ''
  # Rebuilds an image by hand, for example a release from its tag.
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (run from its tag, such as v0.4.0), or empty for a preview build of main
        type: string
        default: ''

permissions:
  contents: read

env:
  IMAGE: ghcr.io/malejandrovc/mirador

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # Version 1.4.0 is tagged 1.4.0, 1.4 and latest; main is the preview tag.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Mirador
            org.opencontainers.image.licenses=AGPL-3.0-only
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A signed record of which workflow and commit built the image, checked with
      # `gh attestation verify oci://ghcr.io/malejandrovc/mirador:<tag> -R MAlejandroVC/mirador`.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
